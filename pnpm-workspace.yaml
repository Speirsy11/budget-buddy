packages:
  - "apps/*"
  - "packages/compositions/*"
  - "packages/shared/*"
  - "packages/features/*"

# Transitive dependency pins, almost all of them security patches for packages
# we do not depend on directly (they arrive via next, expo and react-email).
#
# These live here rather than under "pnpm.overrides" in package.json: pnpm 10
# no longer reads that field and silently ignores it, which is how these pins
# went stale without anyone noticing. `pnpm install` warns about the old
# location if it ever reappears.
#
# When bumping, run `pnpm audit --prod --audit-level high` to confirm the
# advisory is actually cleared — the required version is often higher than the
# one that first fixed it.
overrides:
  # React is pinned to 18 across the workspace; Expo and react-email are not
  # yet happy on 19. Not a security pin — do not "upgrade" these casually.
  react: 18.3.1
  react-dom: 18.3.1
  "@types/react": ~18.3.12
  "@types/react-dom": ~18.3.0

  # Security patches
  "@babel/plugin-transform-modules-systemjs": 7.29.4
  "@babel/core": 7.29.6
  "@xmldom/xmldom": 0.8.13
  ajv@8: 8.18.0
  axios: 1.18.1
  bn.js: 5.2.3
  brace-expansion@1: 1.1.16
  "brace-expansion@>=2": 5.0.8
  fast-uri: 3.1.4
  form-data: 4.0.6
  js-yaml: 4.3.0
  jsondiffpatch: 0.7.2
  lodash: 4.18.1
  minimatch@3: 3.1.4
  minimatch@9: 9.0.7
  node-forge: 1.4.0
  picomatch@2: 2.3.2
  picomatch@3: 3.0.2
  picomatch@4: 4.0.4
  postcss: 8.5.24
  prismjs: 1.30.0
  qs: 6.15.2
  sharp: 0.35.3
  shell-quote: 1.10.0
  tar: 7.5.22
  undici: 6.27.0
  uuid: 11.1.1
  ws@6: 6.2.4
  ws@7: 7.5.11
  ws@8: 8.21.0
  yaml: 1.10.3

auditConfig:
  ignoreGhsas:
    # brace-expansion DoS. The advisory declares its vulnerable range as
    # "<=5.0.7", but the 1.x line was fixed separately in 1.1.16 and there is
    # no 1.x release above 5.0.7 that could ever satisfy that range. pnpm audit
    # compares numerically, so it reports the *patched* 1.1.16 as vulnerable.
    #
    # Verified: the only two copies installed are 1.1.16 (via minimatch@3, the
    # patched 1.x maintenance release) and 5.0.8 (via minimatch@9/@10, above
    # the 5.x fix). Both are patched. Re-check with:
    #   find node_modules -path "*brace-expansion/package.json" \
    #     -exec node -p "require('{}').version" \;
    - GHSA-mh99-v99m-4gvg

